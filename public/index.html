<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCraft AI - AI Website Builder</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#09090f;
    color:#fff;
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    padding:16px 24px;
    background:rgba(9,9,15,.9);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #24242d;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:23px;
    font-weight:800;
    white-space:nowrap;
}

.logo span{
    color:#9b5cff;
}

.nav{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav button{
    border:1px solid transparent;
    background:transparent;
    color:#aaaab5;
    padding:9px 13px;
    border-radius:9px;
}

.nav button:hover{
    color:white;
    background:#17171f;
}

.header-cta{
    background:#9b5cff!important;
    color:white!important;
    border-color:#9b5cff!important;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:calc(100vh - 70px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:70px 20px 90px;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:550px;
    height:550px;
    background:#9b5cff;
    opacity:.07;
    filter:blur(120px);
    border-radius:50%;
    top:0;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

.hero>*{
    position:relative;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 15px;
    border:1px solid #34294a;
    background:#15111d;
    border-radius:50px;
    color:#c9a9ff;
    font-size:14px;
    margin-bottom:25px;
}

h1{
    max-width:900px;
    font-size:clamp(44px,8vw,82px);
    line-height:1.02;
    margin:0;
    letter-spacing:-4px;
}

h1 span{
    color:#9b5cff;
}

.subtitle{
    max-width:680px;
    color:#a9a9b5;
    font-size:18px;
    line-height:1.65;
    margin:25px auto 38px;
}

/* =========================
   BUILDER
========================= */

.builder{
    width:100%;
    max-width:950px;
    background:#121219;
    border:1px solid #2a2a34;
    border-radius:22px;
    padding:20px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
    text-align:left;
}

.builder-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.builder-title{
    font-size:16px;
    font-weight:700;
}

.builder-hint{
    color:#777783;
    font-size:12px;
}

#prompt{
    width:100%;
    min-height:180px;
    resize:vertical;
    background:#191920;
    border:1px solid #353540;
    border-radius:15px;
    color:white;
    padding:18px;
    font-size:16px;
    line-height:1.55;
    outline:none;
}

#prompt:focus{
    border-color:#9b5cff;
    box-shadow:0 0 0 3px rgba(155,92,255,.08);
}

#prompt::placeholder{
    color:#777783;
}

.builder-actions{
    display:flex;
    gap:10px;
    margin-top:13px;
}

#generateBtn{
    flex:1;
    min-height:55px;
    border:0;
    border-radius:13px;
    background:#9b5cff;
    color:white;
    font-size:16px;
    font-weight:800;
    transition:.2s;
}

#generateBtn:hover{
    background:#8b4cf0;
    transform:translateY(-1px);
}

#generateBtn:disabled{
    opacity:.6;
    transform:none;
}

.clear-btn{
    min-height:55px;
    padding:0 18px;
    border-radius:13px;
    background:#22222b;
    color:#dddde5;
    border:1px solid #34343e;
}

.clear-btn:hover{
    background:#2b2b35;
}

#status{
    min-height:25px;
    margin-top:14px;
    color:#aaaab5;
    font-size:14px;
    line-height:1.5;
}

.status-success{
    color:#6ee7a0!important;
}

.status-error{
    color:#ff7777!important;
}

.status-loading{
    color:#c9a9ff!important;
}

/* =========================
   EXAMPLES
========================= */

.examples{
    width:100%;
    max-width:950px;
    margin-top:30px;
}

.examples-title{
    color:#858592;
    margin-bottom:14px;
    font-size:14px;
}

.example-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
}

.example-btn{
    background:#17171f;
    border:1px solid #2b2b35;
    color:#dddde5;
    padding:11px 16px;
    border-radius:50px;
    font-size:14px;
    transition:.2s;
}

.example-btn:hover{
    border-color:#9b5cff;
    color:white;
    transform:translateY(-1px);
}

/* =========================
   QUICK INFO
========================= */

.quick-info{
    width:100%;
    max-width:950px;
    margin-top:45px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.info-card{
    background:#111118;
    border:1px solid #25252e;
    border-radius:15px;
    padding:18px;
    text-align:left;
}

.info-icon{
    font-size:24px;
    margin-bottom:10px;
}

.info-card strong{
    display:block;
    margin-bottom:6px;
}

.info-card p{
    margin:0;
    color:#858592;
    font-size:13px;
    line-height:1.5;
}

/* =========================
   FEATURES
========================= */

.features{
    padding:90px 20px;
    background:#101017;
    border-top:1px solid #20202a;
}

.section-title{
    text-align:center;
    max-width:700px;
    margin:0 auto 45px;
}

.section-title h2{
    font-size:38px;
    margin:0 0 12px;
}

.section-title p{
    color:#92929e;
    line-height:1.6;
    margin:0;
}

.feature-grid{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.feature{
    background:#16161e;
    border:1px solid #292933;
    border-radius:17px;
    padding:26px;
    transition:.2s;
}

.feature:hover{
    transform:translateY(-3px);
    border-color:#42375a;
}

.feature-icon{
    font-size:30px;
    margin-bottom:17px;
}

.feature h3{
    margin:0 0 10px;
    font-size:18px;
}

.feature p{
    color:#9999a5;
    line-height:1.6;
    margin:0;
    font-size:14px;
}

/* =========================
   HOW IT WORKS
========================= */

.how{
    padding:90px 20px;
    background:#0b0b10;
}

.steps{
    max-width:950px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.step{
    text-align:center;
    padding:25px;
}

.step-number{
    width:45px;
    height:45px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#9b5cff;
    font-weight:800;
}

.step h3{
    margin:0 0 10px;
}

.step p{
    color:#91919d;
    line-height:1.6;
    font-size:14px;
}

/* =========================
   CTA
========================= */

.cta{
    padding:80px 20px;
    background:#111118;
    border-top:1px solid #20202a;
    text-align:center;
}

.cta h2{
    font-size:36px;
    margin:0 0 14px;
}

.cta p{
    color:#9999a5;
    margin:0 auto 25px;
}

.cta button{
    background:#9b5cff;
    color:white;
    border:0;
    border-radius:11px;
    padding:14px 24px;
    font-weight:800;
    font-size:15px;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:30px 20px;
    color:#777783;
    background:#09090f;
    border-top:1px solid #20202a;
    font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:#1d1d26;
    border:1px solid #383842;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    opacity:0;
    transition:.3s;
    z-index:9999;
    pointer-events:none;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:14px;
    }

    .header-inner{
        justify-content:center;
    }

    .nav{
        display:none;
    }

    .hero{
        padding:45px 14px 65px;
    }

    h1{
        letter-spacing:-2.5px;
    }

    .subtitle{
        font-size:16px;
        margin-top:20px;
    }

    .builder{
        padding:14px;
        border-radius:17px;
    }

    .builder-top{
        flex-direction:column;
        align-items:flex-start;
        gap:5px;
    }

    #prompt{
        min-height:170px;
    }

    .builder-actions{
        flex-direction:column;
    }

    .clear-btn{
        width:100%;
    }

    .quick-info{
        grid-template-columns:1fr;
    }

    .feature-grid,
    .steps{
        grid-template-columns:1fr;
    }

    .features,
    .how{
        padding:65px 15px;
    }

    .section-title h2,
    .cta h2{
        font-size:30px;
    }

    .cta{
        padding:65px 20px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>
    <div class="header-inner">

        <div class="logo">
            ✨ WebCraft <span>AI</span>
        </div>

        <nav class="nav">
            <button onclick="scrollToSection('features')">
                Features
            </button>

            <button onclick="scrollToSection('how')">
                How it works
            </button>

            <button
                class="header-cta"
                onclick="focusPrompt()">
                Create Website
            </button>
        </nav>

    </div>
</header>


<!-- =========================
     HERO
========================= -->

<section class="hero" id="home">

    <div class="badge">
        ✨ AI-Powered Website Builder
