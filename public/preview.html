<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebCraft AI - Preview</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b10;
    color: white;
}

body {
    min-height: 100vh;
}

button,
textarea,
input {
    font-family: inherit;
}

button {
    border: none;
    cursor: pointer;
    font-weight: 700;
}

button:active {
    transform: scale(.98);
}


/* ================================
   TOP BAR
================================ */

.topbar {
    min-height: 70px;
    padding: 12px 20px;
    background: #111118;
    border-bottom: 1px solid #292932;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.logo span {
    color: #9b5cff;
}

.top-buttons {
    display: flex;
    gap: 10px;
}

.back-btn,
.download-btn {
    padding: 13px 22px;
    border-radius: 11px;
    color: white;
    font-size: 15px;
}

.back-btn {
    background: #24242d;
}

.download-btn {
    background: #9b5cff;
}


/* ================================
   EDITOR
================================ */

.editor {
    background: #111118;
    border-bottom: 1px solid #292932;
    padding: 20px;
}

.editor-inner {
    max-width: 1100px;
    margin: auto;
}

.editor-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 14px;
}

.edit-row {
    display: flex;
    gap: 12px;
}

#editPrompt {
    flex: 1;

    min-height: 100px;
    max-height: 250px;

    resize: vertical;

    padding: 15px;

    border-radius: 12px;

    border: 1px solid #34343e;

    background: #191920;

    color: white;

    outline: none;

    font-size: 15px;

    line-height: 1.5;
}

#editPrompt:focus {
    border-color: #9b5cff;
}

#editPrompt::placeholder {
    color: #858590;
}

#editBtn {
    min-width: 170px;

    border-radius: 12px;

    background: #9b5cff;

    color: white;

    font-size: 15px;

    padding: 15px 20px;
}

#editBtn:disabled {
    opacity: .55;
    cursor: not-allowed;
}


/* ================================
   IMAGE UPLOAD
================================ */

.image-upload-box {
    margin-top: 14px;

    padding: 15px;

    background: #191920;

    border: 1px solid #292933;

    border-radius: 12px;
}

.image-upload-title {
    font-size: 14px;

    font-weight: 700;

    margin-bottom: 10px;
}

.image-upload-row {
    display: flex;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}

#imageInput {
    display: none;
}

.image-select-btn {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 45px;

    padding: 10px 16px;

    border-radius: 10px;

    background: #25252f;

    border: 1px solid #363642;

    color: white;

    cursor: pointer;

    font-size: 14px;

    font-weight: 700;
}

.image-select-btn:hover {
    border-color: #9b5cff;
}

#imageName {
    color: #9999a5;

    font-size: 13px;

    word-break: break-word;
}

.image-preview-box {
    display: none;

    margin-top: 12px;

    position: relative;

    width: 150px;
}

#uploadedImagePreview {
    display: block;

    width: 150px;

    height: 100px;

    object-fit: cover;

    border-radius: 10px;

    border: 1px solid #34343f;
}

.remove-image-btn {
    position: absolute;

    top: -8px;

    right: -8px;

    width: 28px;

    height: 28px;

    border-radius: 50%;

    background: #ff5555;

    color: white;

    font-size: 14px;

    padding: 0;
}


/* ================================
   STATUS
================================ */

#status {
    min-height: 30px;

    padding-top: 12px;

    text-align: center;

    font-size: 14px;
}

.status-success {
    color: #6ee7a0;
}

.status-error {
    color: #ff7777;
}

.status-loading {
    color: #c9a9ff;
}


/* ================================
   DEVICES
================================ */

.device-toolbar {
    padding: 12px;

    background: #17171f;

    border-bottom: 1px solid #292932;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;
}

.device-btn {
    background: #25252f;

    border: 1px solid #363642;

    color: #d0d0d8;

    padding: 10px 17px;

    border-radius: 9px;
}

.device-btn.active {
    background: #9b5cff;

    color: white;

    border-color: #9b5cff;
}

.device-label {
    color: #888894;

    font-size: 12px;

    margin-left: 8px;
}


/* ================================
   PREVIEW
================================ */

.preview-wrapper {
    min-height: calc(100vh - 300px);

    background: #222;

    padding: 25px 15px 50px;

    overflow-x: auto;
}

.preview-stage {
    width: 100%;

    display: flex;

    justify-content: center;

    align-items: flex-start;
}

.preview-container {
    background: white;

    overflow: hidden;

    box-shadow:
        0 15px 50px rgba(0,0,0,.5);

    transition: width .25s ease;
}

.preview-container.desktop {
    width: 100%;

    max-width: 1400px;

    border-radius: 12px;
}

.preview-container.tablet {
    width: 768px;

    max-width: 100%;

    border-radius: 12px;
}

.preview-container.mobile {
    width: 390px;

    max-width: 100%;

    border-radius: 18px;
}

#websitePreview {
    display: block;

    width: 100%;

    height: 75vh;

    min-height: 500px;

    border: none;

    background: white;
}


/* ================================
   EMPTY
================================ */

.empty {
    min-height: 65vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.empty h2 {
    font-size: 28px;
}

.empty p {
    color: #aaa;
}

.create-btn {
    background: #9b5cff;

    color: white;

    padding: 13px 22px;

    border-radius: 10px;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

    .topbar {
        flex-direction: column;

        padding: 14px;
    }

    .logo {
        text-align: center;
    }

    .top-buttons {
        width: 100%;
    }

    .top-buttons button {
        flex: 1;
    }

    .editor {
        padding: 14px;
    }

    .edit-row {
        flex-direction: column;
    }

    #editPrompt {
        min-height: 120px;
    }

    #editBtn {
        min-height: 52px;
    }

    .image-upload-box {
        padding: 12px;
    }

    .image-upload-row {
        align-items: stretch;

        flex-direction: column;
    }

    .image-select-btn {
        width: 100%;
    }

    #imageName {
        padding-top: 3px;
    }

    .preview-wrapper {
        padding: 15px 8px 30px;
    }

    #websitePreview {
        height: 70vh;

        min-height: 450px;
    }
}

</style>
</head>


<body>


<!-- =================================
     TOP BAR
================================= -->

<header class="topbar">

    <div class="logo">
        ✨ WebCraft <span>AI</span>
    </div>

    <div class="top-buttons">

        <button
            type="button"
            class="back-btn"
            onclick="goBack()">

            ← Back

        </button>


        <button
            type="button"
            class="download-btn"
            onclick="downloadWebsite()">

            📥 Download

        </button>

    </div>

</header>



<!-- =================================
     EDITOR
================================= -->

<section class="editor">

    <div class="editor-inner">

        <div class="editor-title">

            ✏️ Edit your website with AI

        </div>


        <div class="edit-row">

            <textarea
                id="editPrompt"
                placeholder="Tell AI what you want to change...

Example:
Change the colors to green and white.
Add a WhatsApp button.
Make the hero section more attractive.
Add a pricing section.
Use my uploaded image as the hero image."
            ></textarea>


            <button
                type="button"
                id="editBtn"
                onclick="editWebsite()">

                ✨ Edit Website

            </button>

        </div>



        <!-- IMAGE UPLOAD -->

        <div class="image-upload-box">

            <div class="image-upload-title">

                📷 Add an image to your website

            </div>


            <div class="image-upload-row">

                <label
                    for="imageInput"
                    class="image-select-btn">

                    📁 Choose Image

                </label>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >


                <span id="imageName">

                    No image selected

                </span>

            </div>



            <div
                id="imagePreviewBox"
                class="image-preview-box">

                <img
                    id="uploadedImagePreview"
                    alt="Uploaded image preview"
                >


                <button
                    type="button"
                    class="remove-image-btn"
                    onclick="removeUploadedImage()">

                    ×

                </button>

            </div>

        </div>


        <div id="status"></div>

    </div>

</section>



<!-- =================================
     DEVICE TOOLBAR
================================= -->

<div class="device-toolbar">


    <button
        type="button"
        class="device-btn active"
        id="desktopBtn"
        onclick="setDevice('desktop')">

        🖥️ Desktop

    </button>


    <button
        type="button"
        class="device-btn"
        id="tabletBtn"
        onclick="setDevice('tablet')">

        📱 Tablet

    </button>


    <button
        type="button"
        class="device-btn"
        id="mobileBtn"
        onclick="setDevice('mobile')">

        📱 Mobile

    </button>


    <span
        class="device-label"
        id="deviceLabel">

        Desktop — 1400px

    </span>

</div>



<!-- =================================
     PREVIEW
================================= -->

<main class="preview-wrapper">


    <div
        id="emptyState"
        class="empty"
        style="display:none;">

        <h2>

            No website found

        </h2>


        <p>

            Generate a website first before opening the preview.

        </p>


        <button
            type="button"
            class="create-btn"
            onclick="goBack()">

            ✨ Create Website

        </button>

    </div>



    <div
        id="previewStage"
        class="preview-stage">


        <div
            id="previewContainer"
            class="preview-container desktop">


            <iframe
                id="websitePreview"
                title="Generated Website"
                sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin">
            </iframe>


        </div>

    </div>

</main>



<script>

/* =====================================
   CONFIGURATION
===================================== */

const AI_URL =
    "https://webcraft-ai-1.lutaayacyrus76.workers.dev/api/generate";


/* =====================================
   ELEMENTS
===================================== */

const preview =
    document.getElementById(
        "websitePreview"
    );


const editPrompt =
    document.getElementById(
        "editPrompt"
    );


const editBtn =
    document.getElementById(
        "editBtn"
    );


const status =
    document.getElementById(
        "status"
    );


const previewContainer =
    document.getElementById(
        "previewContainer"
    );


const previewStage =
    document.getElementById(
        "previewStage"
    );


const emptyState =
    document.getElementById(
        "emptyState"
    );


const deviceLabel =
    document.getElementById(
        "deviceLabel"
    );


const imageInput =
    document.getElementById(
        "imageInput"
    );


const imageName =
    document.getElementById(
        "imageName"
    );


const imagePreviewBox =
    document.getElementById(
        "imagePreviewBox"
    );


const uploadedImagePreview =
    document.getElementById(
        "uploadedImagePreview"
    );


/* =====================================
   IMAGE DATA
===================================== */

let uploadedImageData = null;


/* =====================================
   LOAD GENERATED WEBSITE
===================================== */

let website =
    localStorage.getItem(
        "generatedWebsite"
    );


if (!website) {

    previewStage.style.display =
        "none";

    emptyState.style.display =
        "flex";

    showStatus(
        "No generated website found. Go back and generate a website first.",
        "error"
    );

} else {

    previewStage.style.display =
        "flex";

    emptyState.style.display =
        "none";

    loadWebsiteIntoPreview();

}


/* =====================================
   LOAD WEBSITE SAFELY
===================================== */

function loadWebsiteIntoPreview() {

    if (!website) {
        return;
    }

    try {

        preview.srcdoc =
            website;

    } catch (error) {

        console.error(
            "Preview error:",
            error
        );

        showStatus(
            "❌ Could not load the generated website.",
            "error"
        );

    }

}


/* =====================================
   PREVIEW LOAD EVENTS
===================================== */

preview.addEventListener(
    "load",
    function() {

        console.log(
            "WebCraft website preview loaded."
        );

    }
);


/* =====================================
   IMAGE SELECTED
===================================== */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            imageInput.files &&
            imageInput.files[0];


        if (!file) {
            return;
        }


        /* Check image type */

        if (
            !file.type ||
            !file.type.startsWith("image/")
        ) {

            showStatus(
                "❌ Please choose a valid image.",
                "error"
            );

            imageInput.value = "";

            return;

        }


        /* Maximum 5MB */

        const maxSize =
            5 * 1024 * 1024;


        if (file.size > maxSize) {

            showStatus(
                "❌ Image is too large. Please choose an image under 5MB.",
                "error"
            );

            imageInput.value = "";

            return;

        }


        imageName.textContent =
            file.name;


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                uploadedImageData =
                    event.target.result;


                uploadedImagePreview.src =
                    uploadedImageData;


                imagePreviewBox.style.display =
                    "block";


                showStatus(
                    "📷 Image ready. Tell the AI where you want to use it.",
                    "success"
                );

            };


        reader.onerror =
            function() {

                uploadedImageData =
                    null;

                showStatus(
                    "❌ Could not read the image.",
                    "error"
                );

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================
   REMOVE IMAGE
===================================== */

function removeUploadedImage() {

    uploadedImageData =
        null;


    imageInput.value =
        "";


    imageName.textContent =
        "No image selected";


    uploadedImagePreview.removeAttribute(
        "src"
    );


    imagePreviewBox.style.display =
        "none";


    showStatus(
        "Image removed.",
        "success"
    );

}


/* =====================================
   STATUS
===================================== */

function showStatus(
    message,
    type
) {

    status.textContent =
        message;


    status.className =
        "";


    if (type === "success") {

        status.classList.add(
            "status-success"
        );

    }


    if (type === "error") {

        status.classList.add(
            "status-error"
        );

    }


    if (type === "loading") {

        status.classList.add(
            "status-loading"
        );

    }

}


/* =====================================
   BACK
===================================== */

function goBack() {

    window.location.href =
        "/";

}


/* =====================================
   DEVICE PREVIEW
===================================== */

function setDevice(
    device
) {

    previewContainer.classList.remove(
        "desktop",
        "tablet",
        "mobile"
    );


    previewContainer.classList.add(
        device
    );


    document
        .getElementById("desktopBtn")
        .classList.remove("active");


    document
        .getElementById("tabletBtn")
        .classList.remove("active");


    document
        .getElementById("mobileBtn")
        .classList.remove("active");


    if (device === "desktop") {

        document
            .getElementById("desktopBtn")
            .classList.add("active");


        deviceLabel.textContent =
            "Desktop — 1400px";

    }


    if (device === "tablet") {

        document
            .getElementById("tabletBtn")
            .classList.add("active");


        deviceLabel.textContent =
            "Tablet — 768px";

    }


    if (device === "mobile") {

        document
            .getElementById("mobileBtn")
            .classList.add("active");


        deviceLabel.textContent =
            "Mobile — 390px";

    }

}


/* =====================================
   EDIT WEBSITE WITH AI
===================================== */

async function editWebsite() {

    const instruction =
        editPrompt.value.trim();


    if (!instruction) {

        showStatus(
            "⚠️ Tell the AI what you want to change.",
            "error"
        );

        editPrompt.focus();

        return;

    }


    if (!website) {

        showStatus(
            "❌ No website is available to edit.",
            "error"
        );

        return;

    }


    editBtn.disabled =
        true;


    editBtn.textContent =
        "✨ Editing...";


    showStatus(
        uploadedImageData
            ? "🧠 AI is updating your website with your image..."
            : "🧠 AI is updating your website...",
        "loading"
    );


    try {

        /* ================================
           BUILD REQUEST
        ================================= */

        const requestBody = {

            mode: "edit",

            prompt: instruction,

            website: website

        };


        /*
         * Only send image if user
         * selected one.
         */

        if (uploadedImageData) {

            requestBody.image =
                uploadedImageData;

        }


        console.log(
            "Sending WebCraft edit request..."
        );


        /* ================================
           SEND REQUEST
        ================================= */

        const response =
            await fetch(
                AI_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )
                }
            );


        /* ================================
           READ SERVER RESPONSE
        ================================= */

        const responseText =
            await response.text();


        console.log(
            "WebCraft AI HTTP:",
            response.status
        );


        console.log(
            "WebCraft AI response:",
            responseText
        );


        if (!responseText.trim()) {

            throw new Error(
                "The AI server returned an empty response. HTTP " +
                response.status
            );

        }


        /* ================================
           PARSE JSON
        ================================= */

        let data;

        try {

            data =
                JSON.parse(responseText);

        } catch (jsonError) {

            console.error(
                "JSON parsing error:",
                jsonError
            );

            throw new Error(
                "The AI server returned an invalid response. HTTP " +
                response.status
            );

        }


        /* ================================
           CHECK SERVER RESPONSE
        ================================= */

        if (
            !response.ok ||
            !data ||
            data.success !== true
        ) {

            throw new Error(
                data && data.error
                    ? data.error
                    : "Website editing failed."
            );

        }


        /* ================================
           CHECK GENERATED WEBSITE
        ================================= */

        if (
            typeof data.website !== "string"
        ) {

            throw new Error(
                "AI did not return website HTML."
            );

        }


        const newWebsite =
            data.website.trim();


        if (
            newWebsite.length < 50
        ) {

            throw new Error(
                "AI returned an incomplete website."
            );

        }


        /* ================================
           UPDATE WEBSITE
        ================================= */

        website =
            newWebsite;


        /* ================================
           SAVE WEBSITE
        ================================= */

        localStorage.setItem(
            "generatedWebsite",
            website
        );


        localStorage.setItem(
            "websitePrompt",
            instruction
        );


        /* ================================
           UPDATE PREVIEW
        ================================= */

        preview.srcdoc =
            website;


        /* ================================
           CLEAR EDIT PROMPT
        ================================= */

        editPrompt.value =
            "";


        /* ================================
           CLEAR UPLOADED IMAGE
        ================================= */

        uploadedImageData =
            null;


        imageInput.value =
            "";


        imageName.textContent =
            "No image selected";


        uploadedImagePreview.removeAttribute(
            "src"
        );


        imagePreviewBox.style.display =
            "none";


        /* ================================
           SUCCESS
        ================================= */

        showStatus(
            "✅ Website updated successfully!",
            "success"
        );


    } catch (error) {

        console.error(
            "WebCraft AI EDIT ERROR:",
            error
        );


        showStatus(
            "❌ " +
            (
                error &&
                error.message
                    ? error.message
                    : "Something went wrong."
            ),
            "error"
        );


    } finally {

        editBtn.disabled =
            false;


        editBtn.textContent =
            "✨ Edit Website";

    }

}


/* =====================================
   DOWNLOAD WEBSITE
===================================== */

function downloadWebsite() {

    if (!website) {

        showStatus(
            "❌ There is no website to download.",
            "error"
        );

        return;

    }


    try {

        const blob =
            new Blob(
                [website],
                {
                    type:
                        "text/html;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "webcraft-ai-website.html";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        showStatus(
            "✅ Website downloaded successfully!",
            "success"
        );


    } catch (error) {

        console.error(
            "Download error:",
            error
        );


        showStatus(
            "❌ Could not download the website.",
            "error"
        );

    }

}


/* =====================================
   CTRL + ENTER
===================================== */

editPrompt.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            editWebsite();

        }

    }
);


/* =====================================
   PAGE READY
===================================== */

console.log(
    "✨ WebCraft AI Preview loaded successfully."
);

</script>

</body>
</html>
