<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebCraft AI - Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0b0b10;
            color: white;
        }

        body {
            min-height: 100vh;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 20px;
            background: #111118;
            border-bottom: 1px solid #292932;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo span {
            color: #9b5cff;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.98);
        }

        .back-btn {
            background: #22222b;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
        }

        .download-btn {
            background: #9b5cff;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
        }

        /* =========================
           EDITOR
        ========================= */

        .editor {
            padding: 18px;
            background: #111118;
            border-bottom: 1px solid #292932;
        }

        .editor-inner {
            max-width: 1100px;
            margin: auto;
        }

        .editor-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .edit-row {
            display: flex;
            gap: 10px;
        }

        #editPrompt {
            flex: 1;
            min-height: 58px;
            max-height: 220px;
            resize: vertical;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #34343e;
            background: #191920;
            color: white;
            outline: none;
            font-size: 15px;
            line-height: 1.5;
        }

        #editPrompt::placeholder {
            color: #8f8f9a;
        }

        #editPrompt:focus {
            border-color: #9b5cff;
            box-shadow: 0 0 0 2px rgba(155, 92, 255, 0.12);
        }

        #editBtn {
            background: #9b5cff;
            color: white;
            padding: 0 22px;
            border-radius: 12px;
            min-width: 150px;
            transition: 0.2s;
        }

        #editBtn:hover {
            opacity: 0.92;
        }

        #editBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            text-align: center;
            padding: 12px 5px 2px;
            font-size: 14px;
            color: #bdbdc8;
            min-height: 35px;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            color: #6ee7a0 !important;
        }

        .error {
            color: #ff7777 !important;
        }

        .loading {
            color: #c9a9ff !important;
        }

        /* =========================
           PREVIEW AREA
        ========================= */

        .preview-wrapper {
            background: #222;
            padding: 20px;
            min-height: calc(100vh - 190px);
        }

        .preview-container {
            background: white;
            width: 100%;
            max-width: 1400px;
            margin: auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        #websitePreview {
            width: 100%;
            height: 78vh;
            min-height: 500px;
            border: none;
            display: block;
            background: white;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .empty h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .empty p {
            color: #aaa;
            margin-bottom: 20px;
            max-width: 500px;
            line-height: 1.5;
        }

        .create-btn {
            background: #9b5cff;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .topbar {
                min-height: auto;
                padding: 14px;
                flex-direction: column;
                align-items: stretch;
            }

            .logo {
                text-align: center;
                font-size: 20px;
            }

            .top-buttons {
                width: 100%;
            }

            .top-buttons button {
                flex: 1;
            }

            .editor {
                padding: 14px;
            }

            .edit-row {
                flex-direction: column;
            }

            #editPrompt {
                min-height: 110px;
            }

            #editBtn {
                min-height: 52px;
            }

            .preview-wrapper {
                padding: 8px;
            }

            #websitePreview {
                height: 72vh;
                min-height: 450px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

        <div class="logo">
            ✨ WebCraft <span>AI</span>
        </div>

        <div class="top-buttons">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()">
                ← Back
            </button>

            <button
                type="button"
                class="download-btn"
                onclick="downloadWebsite()">
                📥 Download
            </button>

        </div>

    </header>


    <!-- =========================
         AI EDITOR
    ========================= -->

    <section class="editor">

        <div class="editor-inner">

            <div class="editor-title">
                ✏️ Edit your website with AI
            </div>

            <div class="edit-row">

                <textarea
                    id="editPrompt"
                    placeholder="Tell AI what you want to change...

Example:
Change the colors to green and white.
Add a WhatsApp button.
Make the hero section more attractive.
Add a pricing section."
                ></textarea>

                <button
                    type="button"
                    id="editBtn"
                    onclick="editWebsite()">
                    ✨ Edit Website
                </button>

            </div>

            <div id="status"></div>

        </div>

    </section>


    <!-- =========================
         WEBSITE PREVIEW
    ========================= -->

    <main class="preview-wrapper">

        <div
            id="emptyState"
            class="empty"
            style="display:none;">

            <h2>No website found</h2>

            <p>
                Generate a website first before opening the preview.
            </p>

            <button
                type="button"
                class="create-btn"
                onclick="goBack()">
                ✨ Create Website
            </button>

        </div>


        <div
            id="previewContainer"
            class="preview-container">

            <iframe
                id="websitePreview"
                title="Generated Website"
                sandbox="allow-scripts allow-forms allow-modals allow-popups">
            </iframe>

        </div>

    </main>


    <script>

        /*
         * =========================
         * CONFIGURATION
         * =========================
         */

        const AI_URL =
            "https://webcraft-ai-1.lutaayacyrus76.workers.dev/api/generate";


        /*
         * =========================
         * ELEMENTS
         * =========================
         */

        const preview =
            document.getElementById("websitePreview");

        const editPrompt =
            document.getElementById("editPrompt");

        const editBtn =
            document.getElementById("editBtn");

        const status =
            document.getElementById("status");

        const previewContainer =
            document.getElementById("previewContainer");

        const emptyState =
            document.getElementById("emptyState");


        /*
         * =========================
         * LOAD WEBSITE
         * =========================
         */

        let website =
            localStorage.getItem("generatedWebsite");


        if (!website) {

            previewContainer.style.display =
                "none";

            emptyState.style.display =
                "flex";

            status.textContent =
                "No generated website found.";

        } else {

            previewContainer.style.display =
                "block";

            emptyState.style.display =
                "none";

            preview.srcdoc =
                website;

        }


        /*
         * =========================
         * SHOW STATUS
         * =========================
         */

        function showStatus(
            message,
            type = ""
        ) {

            status.textContent =
                message;

            status.className =
                type;

        }


        /*
         * =========================
         * EDIT WEBSITE
         * =========================
         */

        async function editWebsite() {

            const instruction =
                editPrompt.value.trim();


            /*
             * Validate instruction
             */

            if (!instruction) {

                showStatus(
                    "⚠️ Tell the AI what you want to change.",
                    "error"
                );

                editPrompt.focus();

                return;

            }


            /*
             * Validate website
             */

            if (!website) {

                showStatus(
                    "❌ No website is available to edit.",
                    "error"
                );

                return;

            }


            /*
             * Disable button
             */

            editBtn.disabled =
                true;

            editBtn.textContent =
                "✨ Editing...";

            showStatus(
                "🧠 AI is updating your website...",
                "loading"
            );


            try {

                /*
                 * Send request
                 */

                const response =
                    await fetch(
                        AI_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                mode: "edit",

                                prompt:
                                    instruction,

                                website:
                                    website

                            })
                        }
                    );


                /*
                 * IMPORTANT:
                 *
                 * Read the response as TEXT first.
                 *
                 * This prevents:
                 *
                 * Unexpected end of JSON input
                 */

                const responseText =
                    await response.text();


                console.log(
                    "SERVER STATUS:",
                    response.status
                );

                console.log(
                    "SERVER RESPONSE:",
                    responseText
                );


                /*
                 * Check for empty response
                 */

                if (!responseText.trim()) {

                    throw new Error(
                        "The server returned an empty response. HTTP status: " +
                        response.status
                    );

                }


                /*
                 * Convert response to JSON
                 */

                let data;

                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                } catch (jsonError) {

                    /*
                     * Server returned something
                     * that wasn't JSON.
                     */

                    throw new Error(
                        "Server returned an invalid response. HTTP status: " +
                        response.status
                    );

                }


                /*
                 * Check API success
                 */

                if (
                    !response.ok ||
                    !data ||
                    data.success !== true
                ) {

                    throw new Error(
                        (
                            data &&
                            data.error
                        )
                            ? data.error
                            : "Website editing failed."
                    );

                }


                /*
                 * Validate returned website
                 */

                if (
                    !data.website ||
                    typeof data.website !== "string"
                ) {

                    throw new Error(
                        "AI did not return a valid website."
                    );

                }


                if (
                    data.website.length < 50
                ) {

                    throw new Error(
                        "AI returned an incomplete website."
                    );

                }


                /*
                 * UPDATE WEBSITE
                 */

                website =
                    data.website;


                /*
                 * SAVE WEBSITE
                 */

                localStorage.setItem(
                    "generatedWebsite",
                    website
                );


                /*
                 * Save latest instruction
                 */

                localStorage.setItem(
                    "websitePrompt",
                    instruction
                );


                /*
                 * UPDATE PREVIEW
                 */

                preview.srcdoc =
                    website;


                /*
                 * Clear prompt
                 */

                editPrompt.value =
                    "";


                /*
                 * Success
                 */

                showStatus(
                    "✅ Website updated successfully!",
                    "success"
                );


            } catch (error) {

                console.error(
                    "EDIT ERROR:",
                    error
                );


                showStatus(
                    "❌ " +
                    (
                        error.message ||
                        "Website editing failed."
                    ),
                    "error"
                );


            } finally {

                /*
                 * Re-enable button
                 */

                editBtn.disabled =
                    false;

                editBtn.textContent =
                    "✨ Edit Website";

            }

        }


        /*
         * =========================
         * DOWNLOAD WEBSITE
         * =========================
         */

        function downloadWebsite() {

            if (!website) {

                alert(
                    "No website available to download."
                );

                return;

            }


            const blob =
                new Blob(
                    [website],
                    {
                        type:
                            "text/html;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                "webcraft-website.html";


            document.body.appendChild(
                link
            );

            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                function () {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );

        }


        /*
         * =========================
         * BACK TO CREATOR
         * =========================
         */

        function goBack() {

            window.location.href =
                "index.html";

        }


        /*
         * =========================
         * CTRL + ENTER
         * =========================
         */

        editPrompt.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.ctrlKey &&
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    editWebsite();

                }

            }
        );

    </script>

</body>
    </html>
